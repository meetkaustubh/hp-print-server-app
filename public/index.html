<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Print</title>
  <link rel="icon" href="/brand-logo">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <img id="logo" src="/brand-logo" alt="" width="40" height="40">
    <div class="brand"><h1 id="bizName">Print</h1><p id="tagline"></p></div>
    <button id="theme" class="iconbtn" type="button" aria-label="Switch light / dark theme"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg></button>
    <span id="pill" class="pill" role="status" aria-live="polite">Checking…</span>
  </header>

  <main id="app">
    <!-- Cart: upload + per-document options -->
    <section id="screenCart">
      <div id="emptyState" class="card">
        <label id="drop" class="drop" for="file">
          <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true"><path d="M12 16V4m0 0L7 9m5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <strong>Tap to choose files</strong>
          <span>or drop them here</span>
          <small id="acceptHint"></small>
        </label>
        <ol class="how"><li><b>1</b> Upload</li><li><b>2</b> Pick options</li><li><b>3</b> Pay &amp; collect</li></ol>
      </div>
      <input id="file" type="file" class="sr-only" multiple>
      <div id="pickError" class="error" role="alert" hidden></div>

      <div id="bulk" class="chipbar" role="group" aria-label="Apply to all documents" hidden></div>
      <div id="cartList" class="vgrid" aria-live="polite"></div>
      <button id="addMore" class="btn addmore" type="button" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg> Add another file
      </button>

      <div id="paybar" class="paybar sticky" hidden>
        <div class="sum"><span id="sumDetail" class="muted"></span><strong id="sumTotal"></strong></div>
        <div id="optsError" class="error" role="alert" hidden></div>
        <button id="payBtn" class="btn primary" type="button">Pay &amp; print</button>
        <p class="legal">By continuing you agree to the <a href="/legal/terms" target="_blank" rel="noopener">Terms</a>, <a href="/legal/privacy" target="_blank" rel="noopener">Privacy</a> and <a href="/legal/refund" target="_blank" rel="noopener">Refund policy</a>.</p>
      </div>
    </section>

    <!-- Status after paying -->
    <section id="screenStatus" class="card center" hidden aria-live="polite">
      <div id="statusIcon" class="bigicon" aria-hidden="true"></div>
      <h2 id="statusTitle"></h2>
      <p id="statusText" class="muted"></p>
      <ul id="statusDocs" class="statusdocs"></ul>
      <ol id="steps" class="steps" aria-label="Progress"><li data-s="paid">Paid</li><li data-s="printing">Printing</li><li data-s="done">Ready</li></ol>
      <p id="statusRef" class="ref" hidden></p>
      <button id="again" class="btn" type="button" hidden>Print more documents</button>
    </section>
  </main>

  <!-- Options sheet for one document -->
  <dialog id="sheet" class="picker sheet" aria-labelledby="sheetTitle">
    <div class="pk-head">
      <div><h2 id="sheetTitle">Print options</h2><p id="sheetSub" class="muted"></p></div>
      <button id="sheetClose" class="link" type="button" aria-label="Close">✕</button>
    </div>
    <div id="sheetBody" class="sheetbody"></div>
    <div class="pk-foot sheetfoot"><div class="sum"><span id="sheetDetail" class="muted"></span><strong id="sheetPrice"></strong></div><button id="sheetDone" class="btn primary" type="button">Done</button></div>
  </dialog>

  <!-- Page picker -->
  <dialog id="picker" class="picker" aria-labelledby="pickerTitle">
    <div class="pk-head">
      <div><h2 id="pickerTitle">Choose pages</h2><p id="pickerSub" class="muted"></p></div>
      <button id="pickerClose" class="link" type="button" aria-label="Close">✕</button>
    </div>
    <div class="pk-tools" id="pkTools"></div>
    <div class="pk-range"><label for="pkRange" class="sr-only">Page range</label><input id="pkRange" type="text" placeholder="Type pages, e.g. 1-3, 5" autocomplete="off"></div>
    <div id="pkGrid" class="pk-grid" role="group" aria-label="Pages"></div>
    <div class="pk-foot"><button id="pickerDone" class="btn primary" type="button">Done</button></div>
  </dialog>

  <footer class="foot"><a href="/legal/terms">Terms</a> · <a href="/legal/privacy">Privacy</a> · <a href="/legal/refund">Refunds</a></footer>
  <script src="/app.js" defer></script>
</body>
</html>
